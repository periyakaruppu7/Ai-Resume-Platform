server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ai-resume-matching-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://airesumedb-prakashkaruppu7-55c5.f.aivencloud.com:10408/defaultdb?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD:your_aiven_password_here}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Spring AI configuration using Groq (OpenAI-compatible)
  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY:gsk_your_groq_api_key_here}
      chat:
        options:
          model: llama-3.1-8b-instant
          temperature: 0.2

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 Hours

# Document Storage Path
file:
  upload-dir: ${UPLOAD_DIR:./uploads}

# OpenAPI / Swagger Config
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html